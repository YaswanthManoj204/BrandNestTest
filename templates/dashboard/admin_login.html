{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In - BrandNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primary-green: #10B981;
      --primary-green-dark: #059669;
      --primary-green-light: #D1FAE5;
      --canvas-bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #F0FDF4 0%, #F8FAFC 50%, #ECFDF5 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .admin-login-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .admin-login-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #0F172A;
      text-decoration: none;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--primary-green);
      color: #FFFFFF;
      display: grid;
      place-items: center;
      font-size: 22px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .admin-pill-tag {
      display: inline-block;
      margin-top: 8px;
      background: #D1FAE5;
      color: #047857;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 99px;
      border: 1px solid #A7F3D0;
    }

    .login-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    .login-card-title {
      font-size: 20px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 6px;
    }

    .login-card-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-control {
      font-size: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #CBD5E1;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }

    .input-group-text {
      background: #F8FAFC;
      border-color: #CBD5E1;
      color: #64748B;
      border-radius: 12px;
    }

    .btn-admin-submit {
      width: 100%;
      background: var(--primary-green);
      border: none;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 15px;
      padding: 13px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-admin-submit:hover {
      background: var(--primary-green-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .public-site-link {
      text-align: center;
      margin-top: 24px;
      font-size: 13.5px;
    }

    .public-site-link a {
      color: #64748B;
      text-decoration: none;
      font-weight: 600;
    }

    .public-site-link a:hover {
      color: var(--primary-green-dark);
    }
  </style>
</head>
<body>

  <div class="admin-login-wrapper">
    <!-- Brand Header -->
    <div class="admin-login-brand">
      <div class="brand-badge">
        <div class="brand-icon">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <span>Brand<span style="color:var(--primary-green);">Nest</span></span>
      </div>
      <div>
        <span class="admin-pill-tag"><i class="bi bi-gear-fill me-1"></i> Admin Portal</span>
      </div>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <h2 class="login-card-title">Sign in to Admin Dashboard</h2>
      <p class="login-card-subtitle">Enter your administrative credentials to continue.</p>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% else %}info{% endif %} d-flex align-items-center gap-2 py-2 px-3 mb-3" style="border-radius:10px;font-size:13px;">
            <i class="bi {% if message.tags == 'error' %}bi-exclamation-circle-fill{% elif message.tags == 'success' %}bi-check-circle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
            <div>{{ message }}</div>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" action="{% url 'admin_login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next|default:'' }}">

        <!-- Username or Email -->
        <div class="mb-3">
          <label for="adminUsernameInput" class="form-label">Username or Admin Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" id="adminUsernameInput" name="username" class="form-control" placeholder="Enter username or email" value="{{ username|default:'' }}" required autofocus>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="adminPasswordInput" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" id="adminPasswordInput" name="password" class="form-control" placeholder="Enter password" required>
            <button class="btn btn-outline-secondary input-group-text" type="button" onclick="togglePasswordVisibility('adminPasswordInput', this)" title="Show/Hide Password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me -->
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMeCheck" checked>
            <label class="form-check-label text-secondary" for="rememberMeCheck" style="font-size:13px;">
              Remember me
            </label>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-admin-submit">
          <span>Sign In to Dashboard</span>
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>
    </div>

    <!-- Back to Public Site -->
    <div class="public-site-link">
      <a href="/"><i class="bi bi-arrow-left me-1"></i> Return to Public Website</a>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    }
  </script>
</body>
</html>
