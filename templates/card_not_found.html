<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Not Found - BrandNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 10%, #F1F5F9 0%, #E2E8F0 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0F172A;
      padding: 24px;
    }
    .notfound-card {
      max-width: 460px;
      width: 100%;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.12);
      border: 1px solid #E2E8F0;
      text-align: center;
    }
    .icon-box {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #FEF2F2;
      color: #EF4444;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="notfound-card">
    <div class="icon-box">
      <i class="bi bi-person-x-fill"></i>
    </div>
    <h2 class="fw-bold mb-2" style="font-size:22px;letter-spacing:-0.02em;">Card Not Found</h2>
    <p class="text-secondary small mb-3">
      The digital business card at <code class="text-primary fw-semibold">{{ request.get_host }}</code> has not been claimed or was moved.
    </p>
    <div class="p-3 bg-light rounded-4 border mb-4 text-start">
      <span class="small text-muted d-block mb-1">Looking for your own custom subdomain card?</span>
      <span class="fw-bold text-dark small d-block">Create and claim your luxury contactless business card on BrandNest today!</span>
    </div>
    <div class="d-grid gap-2">
      <a href="/card/create/" class="btn btn-dark rounded-pill py-2.5 fw-bold shadow-sm">
        <i class="bi bi-stars text-warning me-1"></i> Claim Your Digital Card
      </a>
      <a href="/" class="btn btn-outline-secondary rounded-pill py-2 small">
        &larr; Return to BrandNest Home
      </a>
    </div>
  </div>
</body>
</html>
